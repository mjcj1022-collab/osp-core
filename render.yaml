# Render blueprint for the OSP shared backend — ONE service + ONE database that
# BIM / REDLINE / Make-Ready (and ODEN) all call.
#
# This blueprint provisions BOTH the Postgres database and the web service, and
# auto-injects DATABASE_URL — so no DB password is ever handled by hand.
#
# The only secret to set manually (in the dashboard, later) is GOTRUE_JWT_SECRET,
# used to verify Netlify Identity logins. It can stay blank until app auth is
# wired; the service still deploys, migrates, and serves /healthz without it.
databases:
  - name: osp-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: osp-shared-backend
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    # Creates the core schema, RLS policies, and the PostGIS geom column on first
    # deploy, and applies any later migrations before traffic shifts.
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: osp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: GOTRUE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://light-speed-bim.netlify.app,https://redline-app.netlify.app,https://courageous-seahorse-d21112.netlify.app,https://lucky-basbousa-c909b8.netlify.app"
