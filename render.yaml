# Render blueprint for the OSP shared backend — ONE service + ONE database that
# BIM / REDLINE / Make-Ready (and ODEN) all call.
#
# Creates the web service and points it at an EXTERNAL Postgres (Supabase) set
# via the DATABASE_URL secret in the dashboard. (Render's free tier allows only
# one free managed database, which this account already uses for Make-Ready.)
#
# GOTRUE_JWT_SECRET (verifies Netlify Identity logins) can be added later; the
# service deploys, migrates, and serves /healthz without it.
# Uses an EXTERNAL Postgres (Supabase) via the DATABASE_URL secret below.
# Render's free tier allows only one free database and this account already has
# one (makeready-db). Supabase's free Postgres includes PostGIS, which suits the
# generated geom column.
services:
  - type: web
    name: osp-shared-backend
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    # Free tier doesn't support preDeployCommand, so migrations run at container
    # startup (see the Docker CMD) — creating the core schema, RLS policies, and
    # the PostGIS geom column on first boot.
    envVars:
      # Set in the dashboard to your Supabase Postgres connection string (URI).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_SSL_REQUIRE
        value: "true"
      # GOTRUE_JWT_SECRET (verifies Netlify Identity logins) is added later in the
      # dashboard when app auth is wired — omitted here so the blueprint has no
      # required secret and deploys straight through. Auth endpoints 401 until set.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://light-speed-bim.netlify.app,https://redline-app.netlify.app,https://courageous-seahorse-d21112.netlify.app,https://lucky-basbousa-c909b8.netlify.app"
